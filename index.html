<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moto Route — podgląd trasy</title>
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --ink: #1b1f23;
    --paper: #faf9f7;
    --line: #dcd7cf;
    --accent: #2d6a4f;
    --accent-ink: #ffffff;
    --err: #b3261e;
    --route: #ff4d1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 16px;
    line-height: 1.4;
  }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  p.sub { color: #5b5f63; margin: 0 0 18px; font-size: 0.9rem; }
  textarea {
    width: 100%;
    min-height: 70px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 0.95rem;
    resize: vertical;
    background: #fff;
  }
  button {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    margin-top: 14px;
  }
  .card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; color: #5b5f63; margin: 0 0 8px; }
  .stat { display: flex; justify-content: space-between; font-size: 0.92rem; padding: 3px 0; }
  .err { color: var(--err); font-size: 0.9rem; white-space: pre-wrap; }
  #map {
    width: 100%;
    max-width: 420px;
    aspect-ratio: 9 / 16;
    border-radius: 8px;
    margin: 14px auto 0;
    border: 1px solid var(--line);
    display: none;
  }
  .duration-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .duration-btn {
    flex: 1;
    margin-top: 0;
    padding: 10px;
    font-size: 0.9rem;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .duration-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  #animateBtn { background: var(--route); }
</style>
</head>
<body>

<h1>Podgląd trasy motocyklowej</h1>
<p class="sub">Wklej pełny link Google Maps z trasą. Krótkie linki (maps.app.goo.gl) otwórz najpierw w przeglądarce i skopiuj pełny URL z paska adresu.</p>

<textarea id="linkInput" placeholder="https://www.google.com/maps/dir/..."></textarea>

<button id="parseBtn">1. Wyciągnij punkty z linku</button>
<button id="routeBtn" disabled>2. Pokaż trasę na mapie</button>

<div class="duration-row">
  <button class="duration-btn" data-duration="5">5 s</button>
  <button class="duration-btn active" data-duration="7">7 s</button>
  <button class="duration-btn" data-duration="10">10 s</button>
</div>
<button id="animateBtn" disabled>3. Animuj przejazd</button>

<div id="waypointsCard" class="card" style="display:none">
  <h2>Punkty trasy</h2>
  <div id="waypointsList" style="font-size:0.9rem"></div>
</div>

<div id="routeCard" class="card" style="display:none">
  <h2>Trasa</h2>
  <div class="stat"><span>Dystans drogowy</span><strong id="statDist">—</strong></div>
  <div class="stat"><span>Szac. czas jazdy</span><strong id="statDur">—</strong></div>
</div>

<div id="errorBox" class="card" style="display:none">
  <h2 style="color:#b3261e">Błąd</h2>
  <div class="err" id="errorText"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
"use strict";

/* ---------- 1) Parser linku Google Maps ---------- */
const TRAVEL_MODE_MAP = { 0: "driving", 1: "walking", 2: "bicycling", 3: "transit" };

function parseGoogleMapsLink(url) {
  const { pathname } = new URL(url);

  const pathMatch = pathname.match(/\/maps\/dir\/(.+?)\/data=/);
  const names = pathMatch
    ? pathMatch[1]
        .split("/")
        .filter((seg) => !seg.startsWith("@"))
        .map((seg) => decodeURIComponent(seg).replace(/\+/g, " "))
        .map((seg) => seg.split(",")[0].trim())
    : [];

  const coords = [];
  const reA = /!8m2!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/g;
  let m;
  while ((m = reA.exec(url)) !== null) {
    coords.push({ lat: parseFloat(m[1]), lng: parseFloat(m[2]) });
  }
  if (coords.length === 0) {
    const reB = /!1d(-?\d+\.\d+)!2d(-?\d+\.\d+)/g;
    while ((m = reB.exec(url)) !== null) {
      coords.push({ lat: parseFloat(m[2]), lng: parseFloat(m[1]) });
    }
  }
  if (coords.length === 0) {
    throw new Error(
      "Nie znalazłem żadnych współrzędnych w tym linku.\n" +
      "- jeśli to krótki link (maps.app.goo.gl), otwórz go najpierw w przeglądarce i wklej pełny URL,\n" +
      "- to może być link do pojedynczego miejsca, a nie do trasy."
    );
  }

  const waypoints = coords.map((c, i) => ({
    name: names[i] ?? `Punkt ${i + 1}`,
    lat: c.lat,
    lng: c.lng,
  }));

  const modeMatch = url.match(/!3e(\d)/);
  const travelMode = modeMatch ? (TRAVEL_MODE_MAP[modeMatch[1]] ?? "unknown") : "unknown";
  return { travelMode, waypoints };
}

/* ---------- 2) Realny routing (OSRM demo) ---------- */
const OSRM_DEMO_BASE = "https://router.project-osrm.org/route/v1/driving";

async function fetchRoadRoute(waypoints) {
  const coordsParam = waypoints.map((w) => `${w.lng},${w.lat}`).join(";");
  const url = `${OSRM_DEMO_BASE}/${coordsParam}?overview=full&geometries=geojson&steps=false`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Serwer routingu zwrócił błąd HTTP ${res.status}.`);
  const data = await res.json();
  if (data.code !== "Ok" || !data.routes?.length) {
    throw new Error(`Nie udało się policzyć trasy (code: ${data.code}).`);
  }
  const route = data.routes[0];
  return {
    coordinates: route.geometry.coordinates, // [[lng,lat], ...]
    distanceMeters: route.distance,
    durationSeconds: route.duration,
  };
}

/* ---------- 3) Matematyka animacji: dystans, interpolacja, heading ---------- */
function haversineMeters([lng1, lat1], [lng2, lat2]) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function buildCumulativeDistances(coords) {
  const cum = [0];
  for (let i = 1; i < coords.length; i++) {
    cum.push(cum[i - 1] + haversineMeters(coords[i - 1], coords[i]));
  }
  return cum;
}

// binary search: indeks pierwszego punktu, którego dystans skumulowany >= dist
function indexAtDistance(cum, dist) {
  let lo = 0, hi = cum.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (cum[mid] < dist) lo = mid + 1; else hi = mid;
  }
  return Math.max(1, lo);
}

// pozycja po przebyciu `dist` metrów wzdłuż trasy — liniowa interpolacja
// między dwoma najbliższymi punktami geometrii drogowej
function positionAtDistance(coords, cum, dist) {
  const total = cum[cum.length - 1];
  dist = Math.max(0, Math.min(dist, total));
  const i = indexAtDistance(cum, dist);
  const segStart = cum[i - 1], segEnd = cum[i];
  const t = segEnd === segStart ? 0 : (dist - segStart) / (segEnd - segStart);
  const [lng1, lat1] = coords[i - 1];
  const [lng2, lat2] = coords[i];
  return [lng1 + (lng2 - lng1) * t, lat1 + (lat2 - lat1) * t];
}

function bearingDegrees([lng1, lat1], [lng2, lat2]) {
  const toRad = (d) => (d * Math.PI) / 180;
  const toDeg = (r) => (r * 180) / Math.PI;
  const y = Math.sin(toRad(lng2 - lng1)) * Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lng2 - lng1));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

// heading liczony na trasie INTERPOLOWANEJ (nie z surowych punktów GPX/OSRM),
// żeby gęste/nierówne punkty nie powodowały "drgania" ikony
function headingAtDistance(coords, cum, dist, lookaheadM = 50) {
  const total = cum[cum.length - 1];
  const p1 = positionAtDistance(coords, cum, dist);
  const p2 = positionAtDistance(coords, cum, Math.min(dist + lookaheadM, total));
  if (p1[0] === p2[0] && p1[1] === p2[1]) return null;
  return bearingDegrees(p1, p2);
}

// trasa "narysowana dotąd" — pełne punkty do bieżącej pozycji + dokładny punkt bieżący
function trailUpToDistance(coords, cum, dist) {
  const i = indexAtDistance(cum, dist);
  const trail = coords.slice(0, i);
  trail.push(positionAtDistance(coords, cum, dist));
  return trail;
}

/* ---------- 4) Ikona motocykla (SVG -> rastrowany obraz dla MapLibre) ---------- */
const MOTO_SVG = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="48" r="9" fill="#1b1f23" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="32" cy="17" r="7" fill="#1b1f23" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M32,4 L41,19 L37,46 L27,46 L23,19 Z" fill="#ff4d1f" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
</svg>`.trim();

function loadMotoIcon(mapInstance) {
  return new Promise((resolve, reject) => {
    if (mapInstance.hasImage("moto-icon")) return resolve();
    const img = new Image(128, 128);
    const blob = new Blob([MOTO_SVG], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      mapInstance.addImage("moto-icon", img);
      URL.revokeObjectURL(url);
      resolve();
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ---------- 5) Mapa (MapLibre + OpenFreeMap, bez klucza) ---------- */
let map = null;
let lastRouteCoordinates = null;
let animationRunning = false;
let selectedDuration = 7;

function showRouteOnMap(coordinates, waypoints) {
  const mapEl = document.getElementById("map");
  mapEl.style.display = "block";

  const geojson = {
    type: "Feature",
    geometry: { type: "LineString", coordinates },
  };

  if (!map) {
    map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/positron",
      center: coordinates[0],
      zoom: 5,
    });

    map.on("load", async () => {
      map.addSource("route", { type: "geojson", data: geojson });
      map.addLayer({
        id: "route-line",
        type: "line",
        source: "route",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#ff4d1f", "line-width": 4 },
      });

      // źródła pod animację: ślad (rysowany dotąd) + punkt motocykla
      map.addSource("trail", {
        type: "geojson",
        data: { type: "Feature", geometry: { type: "LineString", coordinates: [] } },
      });
      map.addLayer({
        id: "trail-line",
        type: "line",
        source: "trail",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#ff4d1f", "line-width": 4 },
      });

      map.addSource("moto", {
        type: "geojson",
        data: { type: "Feature", geometry: { type: "Point", coordinates: coordinates[0] }, properties: { bearing: 0 } },
      });
      await loadMotoIcon(map);
      map.addLayer({
        id: "moto-marker",
        type: "symbol",
        source: "moto",
        layout: {
          "icon-image": "moto-icon",
          "icon-size": 0.75,
          "icon-rotate": ["get", "bearing"],
          "icon-rotation-alignment": "map",
          "icon-allow-overlap": true,
          "icon-ignore-placement": true,
        },
      });
      setLayerVisible("moto-marker", false);
      setLayerVisible("trail-line", false);

      waypoints.forEach((w) => {
        new maplibregl.Marker({ color: "#1b1f23" })
          .setLngLat([w.lng, w.lat])
          .setPopup(new maplibregl.Popup({ offset: 12 }).setText(w.name))
          .addTo(map);
      });

      fitToRoute(coordinates);
    });
  } else {
    map.getSource("route").setData(geojson);
    document.querySelectorAll(".maplibregl-marker").forEach((el) => el.remove());
    waypoints.forEach((w) => {
      new maplibregl.Marker({ color: "#1b1f23" })
        .setLngLat([w.lng, w.lat])
        .setPopup(new maplibregl.Popup({ offset: 12 }).setText(w.name))
        .addTo(map);
    });
    fitToRoute(coordinates);
  }
}

function fitToRoute(coordinates) {
  const bounds = coordinates.reduce(
    (b, c) => b.extend(c),
    new maplibregl.LngLatBounds(coordinates[0], coordinates[0])
  );
  // "Full route" tryb kamery: dopasuj kadr RAZ, przed animacją — bez zoomowania w trakcie jazdy
  map.fitBounds(bounds, { padding: 40, duration: 0 });
}

function setLayerVisible(layerId, visible) {
  if (map.getLayer(layerId)) {
    map.setLayoutProperty(layerId, "visibility", visible ? "visible" : "none");
  }
}

async function animateRoute(coordinates, durationSeconds) {
  if (animationRunning) return;
  animationRunning = true;

  await loadMotoIcon(map);

  const cum = buildCumulativeDistances(coordinates);
  const total = cum[cum.length - 1];

  // trasa niewidoczna na starcie, motocykl w punkcie startowym
  setLayerVisible("route-line", false);
  setLayerVisible("trail-line", true);
  setLayerVisible("moto-marker", true);
  map.getSource("trail").setData({ type: "Feature", geometry: { type: "LineString", coordinates: [] } });

  let lastHeading = headingAtDistance(coordinates, cum, 0) ?? 0;
  const startTime = performance.now();

  return new Promise((resolve) => {
    function frame(now) {
      // KLUCZOWE: postęp liczony z czasu zegarowego, nie z liczby klatek —
      // ta sama animacja trwa dokładnie `durationSeconds` niezależnie od 60/90/120 Hz ekranu
      const elapsed = (now - startTime) / 1000;
      const progress = Math.min(elapsed / durationSeconds, 1);
      const distAlong = progress * total;

      const pos = positionAtDistance(coordinates, cum, distAlong);
      const heading = headingAtDistance(coordinates, cum, distAlong);
      if (heading !== null) lastHeading = heading;

      map.getSource("moto").setData({
        type: "Feature",
        geometry: { type: "Point", coordinates: pos },
        properties: { bearing: lastHeading },
      });
      map.getSource("trail").setData({
        type: "Feature",
        geometry: { type: "LineString", coordinates: trailUpToDistance(coordinates, cum, distAlong) },
      });

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        animationRunning = false;
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

/* ---------- 4) Podpięcie UI ---------- */
let lastWaypoints = null;

function showError(msg) {
  document.getElementById("errorBox").style.display = "block";
  document.getElementById("errorText").textContent = msg;
}
function hideError() {
  document.getElementById("errorBox").style.display = "none";
}

document.getElementById("parseBtn").addEventListener("click", () => {
  hideError();
  const url = document.getElementById("linkInput").value.trim();
  try {
    const { waypoints } = parseGoogleMapsLink(url);
    lastWaypoints = waypoints;
    document.getElementById("waypointsList").innerHTML =
      waypoints.map((w) => `${w.name} (${w.lat.toFixed(3)}, ${w.lng.toFixed(3)})`).join("<br>");
    document.getElementById("waypointsCard").style.display = "block";
    document.getElementById("routeBtn").disabled = false;
  } catch (e) {
    showError(e.message);
    document.getElementById("routeBtn").disabled = true;
  }
});

document.getElementById("routeBtn").addEventListener("click", async () => {
  if (!lastWaypoints) return;
  hideError();
  const btn = document.getElementById("routeBtn");
  btn.disabled = true;
  btn.textContent = "Liczę trasę…";
  try {
    const { coordinates, distanceMeters, durationSeconds } = await fetchRoadRoute(lastWaypoints);
    document.getElementById("statDist").textContent = `${(distanceMeters / 1000).toFixed(0)} km`;
    document.getElementById("statDur").textContent = `${(durationSeconds / 3600).toFixed(1)} h`;
    document.getElementById("routeCard").style.display = "block";
    lastRouteCoordinates = coordinates;
    showRouteOnMap(coordinates, lastWaypoints);
    document.getElementById("animateBtn").disabled = false;
  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "2. Pokaż trasę na mapie";
  }
});

document.querySelectorAll(".duration-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".duration-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    selectedDuration = parseInt(btn.dataset.duration, 10);
  });
});

document.getElementById("animateBtn").addEventListener("click", async () => {
  if (!lastRouteCoordinates) return;
  const btn = document.getElementById("animateBtn");
  btn.disabled = true;
  btn.textContent = `Animacja (${selectedDuration}s)…`;
  try {
    await animateRoute(lastRouteCoordinates, selectedDuration);
  } finally {
    btn.disabled = false;
    btn.textContent = "3. Animuj przejazd";
  }
});
</script>
</body>
</html>
